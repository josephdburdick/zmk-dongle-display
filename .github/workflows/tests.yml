name: Host tests
on: [push, pull_request, workflow_dispatch]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pillow pytest
      - run: python3 -m pytest tools -q
      - run: bash tests/stage_fsm/run.sh
      - name: Generated frames are up to date
        run: |
          python3 tools/gen_eight_ball.py
          git diff --exit-code -- boards/shields/dongle_display/widgets/eight_ball_images.c
